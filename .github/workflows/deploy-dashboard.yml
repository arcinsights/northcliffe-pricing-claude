name: Deploy Dashboard

on:
  push:
    branches: [master, main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION || 'europe-west2' }}-docker.pkg.dev

      - name: Build and Push Docker Image
        working-directory: dashboard
        run: |
          IMAGE_TAG="${{ secrets.GCP_REGION || 'europe-west2' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pricing/dashboard:${{ github.sha }}"
          IMAGE_LATEST="${{ secrets.GCP_REGION || 'europe-west2' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pricing/dashboard:latest"

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pricing-dashboard \
            --image=${{ secrets.GCP_REGION || 'europe-west2' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pricing/dashboard:${{ github.sha }} \
            --region=${{ secrets.GCP_REGION || 'europe-west2' }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=${{ secrets.GCP_DASHBOARD_SA }} \
            --set-env-vars="GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=60s

      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe pricing-dashboard \
            --region=${{ secrets.GCP_REGION || 'europe-west2' }} \
            --format='value(status.url)')
          echo "Dashboard URL: $SERVICE_URL"
          echo "DASHBOARD_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Comment URL on Commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ Dashboard deployed successfully!\n\n🔗 URL: ${process.env.DASHBOARD_URL}`
            });
